name: Production smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run smoke -- https://signalbrief-alpha.vercel.app
